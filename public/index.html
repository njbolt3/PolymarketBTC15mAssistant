<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC 15m Assistant</title>
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --border: #2a2a3a;
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --green: #00d991;
      --green-dim: rgba(0, 217, 145, 0.15);
      --red: #ff4466;
      --red-dim: rgba(255, 68, 102, 0.15);
      --yellow: #ffcc00;
      --blue: #5599ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .market-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .market-slug {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .timer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .timer-value {
      font-size: 2.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }

    .timer-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .timer.green .timer-value { color: var(--green); }
    .timer.yellow .timer-value { color: var(--yellow); }
    .timer.red .timer-value { color: var(--red); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .predict-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .predict-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 24px;
      border-radius: 8px;
      flex: 1;
      margin: 0 6px;
    }

    .predict-side.long {
      background: var(--green-dim);
      border: 1px solid var(--green);
    }

    .predict-side.short {
      background: var(--red-dim);
      border: 1px solid var(--red);
    }

    .predict-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .predict-side.long .predict-label { color: var(--green); }
    .predict-side.short .predict-label { color: var(--red); }

    .predict-value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    .predict-side.long .predict-value { color: var(--green); }
    .predict-side.short .predict-value { color: var(--red); }

    .indicator-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .indicator-row:last-child {
      border-bottom: none;
    }

    .indicator-label {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    .indicator-value {
      font-weight: 500;
      font-size: 0.9rem;
    }

    .indicator-value.green { color: var(--green); }
    .indicator-value.red { color: var(--red); }
    .indicator-value.yellow { color: var(--yellow); }
    .indicator-value.neutral { color: var(--text-secondary); }

    .price-display {
      text-align: center;
      padding: 16px;
    }

    .price-main {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .price-delta {
      font-size: 0.9rem;
    }

    .price-delta.positive { color: var(--green); }
    .price-delta.negative { color: var(--red); }

    .polymarket-prices {
      display: flex;
      justify-content: space-around;
      margin-top: 8px;
    }

    .poly-side {
      text-align: center;
    }

    .poly-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .poly-side.up .poly-label { color: var(--green); }
    .poly-side.down .poly-label { color: var(--red); }

    .poly-price {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .poly-side.up .poly-price { color: var(--green); }
    .poly-side.down .poly-price { color: var(--red); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    .status-dot.connected { background: var(--green); }
    .status-dot.disconnected { background: var(--red); }

    .footer {
      text-align: center;
      margin-top: 24px;
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .timer-value { font-size: 2rem; }
      .predict-value { font-size: 1.4rem; }
      .price-main { font-size: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="market-title" id="marketTitle">Connecting...</div>
      <div class="market-slug" id="marketSlug">-</div>
      <div class="timer" id="timer">
        <div>
          <div class="timer-value" id="timeLeft">--:--</div>
          <div class="timer-label">Time Remaining</div>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">TA Prediction</div>
        <div class="predict-row">
          <div class="predict-side long">
            <div class="predict-label">↑ Long</div>
            <div class="predict-value" id="predLong">-</div>
          </div>
          <div class="predict-side short">
            <div class="predict-label">↓ Short</div>
            <div class="predict-value" id="predShort">-</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Polymarket</div>
        <div class="polymarket-prices">
          <div class="poly-side up">
            <div class="poly-label">↑ Up</div>
            <div class="poly-price" id="polyUp">-</div>
          </div>
          <div class="poly-side down">
            <div class="poly-label">↓ Down</div>
            <div class="poly-price" id="polyDown">-</div>
          </div>
        </div>
        <div class="indicator-row" style="margin-top: 16px;">
          <span class="indicator-label">Liquidity</span>
          <span class="indicator-value" id="liquidity">-</span>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-title">Technical Indicators</div>
        <div class="indicator-row">
          <span class="indicator-label">Heiken Ashi</span>
          <span class="indicator-value" id="heikenAshi">-</span>
        </div>
        <div class="indicator-row">
          <span class="indicator-label">RSI</span>
          <span class="indicator-value" id="rsi">-</span>
        </div>
        <div class="indicator-row">
          <span class="indicator-label">MACD</span>
          <span class="indicator-value" id="macd">-</span>
        </div>
        <div class="indicator-row">
          <span class="indicator-label">VWAP</span>
          <span class="indicator-value" id="vwap">-</span>
        </div>
        <div class="indicator-row">
          <span class="indicator-label">Delta 1m / 3m</span>
          <span class="indicator-value" id="delta">-</span>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Prices</div>
        <div class="price-display">
          <div class="price-main" id="currentPrice">$--</div>
          <div class="price-delta" id="priceDelta">-</div>
          <div class="indicator-row" style="margin-top: 16px;">
            <span class="indicator-label">Price to Beat</span>
            <span class="indicator-value" id="priceToBeat">-</span>
          </div>
          <div class="indicator-row">
            <span class="indicator-label">Coinbase Spot</span>
            <span class="indicator-value" id="coinbasePrice">-</span>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div>
        <span class="status-dot disconnected" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
      <div id="sessionInfo">-</div>
    </div>

    <div class="footer">created by @krajekis</div>
  </div>

  <script>
    const WS_URL = `ws://${window.location.host}`;
    let ws = null;
    let reconnectTimeout = null;

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        document.getElementById('statusDot').classList.remove('disconnected');
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').textContent = 'Connected';
      };

      ws.onclose = () => {
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusDot').classList.add('disconnected');
        document.getElementById('statusText').textContent = 'Reconnecting...';
        reconnectTimeout = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          updateUI(data);
        } catch (e) {}
      };
    }

    function formatPct(value) {
      if (value === null || value === undefined) return '-';
      return Math.round(value * 100) + '%';
    }

    function formatPrice(value, decimals = 0) {
      if (value === null || value === undefined) return '-';
      return '$' + Number(value).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    function formatTime(minutes) {
      if (minutes === null || minutes === undefined) return '--:--';
      const totalSec = Math.max(0, Math.floor(minutes * 60));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function getTimerClass(minutes) {
      if (minutes === null) return '';
      if (minutes >= 10) return 'green';
      if (minutes >= 5) return 'yellow';
      return 'red';
    }

    function getNarrativeClass(narrative) {
      if (narrative === 'LONG') return 'green';
      if (narrative === 'SHORT') return 'red';
      return 'neutral';
    }

    function updateUI(data) {
      // Header
      document.getElementById('marketTitle').textContent = data.marketTitle || 'BTC 15m Assistant';
      document.getElementById('marketSlug').textContent = data.marketSlug || '-';

      // Timer
      const timer = document.getElementById('timer');
      timer.className = 'timer ' + getTimerClass(data.timeLeftMin);
      document.getElementById('timeLeft').textContent = formatTime(data.timeLeftMin);

      // TA Prediction
      document.getElementById('predLong').textContent = formatPct(data.predLong);
      document.getElementById('predShort').textContent = formatPct(data.predShort);

      // Polymarket
      document.getElementById('polyUp').textContent = data.polyUp !== null ? data.polyUp + '¢' : '-';
      document.getElementById('polyDown').textContent = data.polyDown !== null ? data.polyDown + '¢' : '-';
      document.getElementById('liquidity').textContent = data.liquidity ? '$' + Number(data.liquidity).toLocaleString() : '-';

      // Indicators
      const heikenEl = document.getElementById('heikenAshi');
      heikenEl.textContent = data.heikenAshi || '-';
      heikenEl.className = 'indicator-value ' + getNarrativeClass(data.heikenNarrative);

      const rsiEl = document.getElementById('rsi');
      rsiEl.textContent = data.rsi || '-';
      rsiEl.className = 'indicator-value ' + getNarrativeClass(data.rsiNarrative);

      const macdEl = document.getElementById('macd');
      macdEl.textContent = data.macd || '-';
      macdEl.className = 'indicator-value ' + getNarrativeClass(data.macdNarrative);

      const vwapEl = document.getElementById('vwap');
      vwapEl.textContent = data.vwap || '-';
      vwapEl.className = 'indicator-value ' + getNarrativeClass(data.vwapNarrative);

      document.getElementById('delta').textContent = data.delta || '-';

      // Prices
      document.getElementById('currentPrice').textContent = formatPrice(data.currentPrice, 2);
      
      const deltaEl = document.getElementById('priceDelta');
      if (data.ptbDelta !== null && data.ptbDelta !== undefined) {
        const sign = data.ptbDelta > 0 ? '+' : '';
        deltaEl.textContent = sign + '$' + data.ptbDelta.toFixed(2) + ' from target';
        deltaEl.className = 'price-delta ' + (data.ptbDelta > 0 ? 'positive' : data.ptbDelta < 0 ? 'negative' : '');
      } else {
        deltaEl.textContent = '-';
        deltaEl.className = 'price-delta';
      }

      document.getElementById('priceToBeat').textContent = formatPrice(data.priceToBeat);
      document.getElementById('coinbasePrice').textContent = formatPrice(data.coinbasePrice);

      // Session
      document.getElementById('sessionInfo').textContent = data.session || '-';
    }

    connect();
  </script>
</body>
</html>
